<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>DEZE7 — Ativar acesso</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100vh;background:#090909;color:#f5f2ec}
    .access-page{min-height:100vh;display:grid;place-items:center;padding:22px}
    .access-card{width:min(520px,100%);background:#111;border:1px solid #292929;border-radius:22px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .access-logo{width:155px;max-height:62px;object-fit:contain;object-position:left center;margin-bottom:24px}
    .access-card h1{font-size:36px;line-height:1.05;margin:8px 0 10px}
    .access-card p{color:#aaa59c;line-height:1.6}
    .control{display:flex;flex-direction:column;gap:8px;margin:15px 0}
    .control span{font-size:13px;font-weight:700;color:#c8c3bb}
    .control input{background:#0b0b0b;color:#fff;border:1px solid #343434;border-radius:12px;padding:14px;font-size:16px}
    .msg{margin-top:18px;padding:13px 14px;border-radius:12px;display:none;line-height:1.45}
    .msg.ok{display:block;border:1px solid #2d5d3b;background:#0f1a12;color:#d6f0dc}
    .msg.warn{display:block;border:1px solid #725b2d;background:#1d180f;color:#f0dfba}
    .msg.err{display:block;border:1px solid #6b3030;background:#1c1010;color:#ffd0d0}
    .small{font-size:13px;color:#8e8a83}
    .link{color:#fff;text-decoration:underline}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <main class="access-page">
    <section class="access-card">
      <img src="assets/logo-deze7.png" class="access-logo" alt="DEZE7">
      <span class="overline">SISTEMA INTERNO</span>
      <h1>Ativar acesso</h1>
      <p>Ativação direta para administradores pré-autorizados da DEZE7. Não será enviado e-mail de confirmação.</p>

      <form id="form">
        <label class="control"><span>E-mail autorizado</span><input id="email" type="email" autocomplete="username" value="contatoandrekojima@gmail.com" required></label>
        <label class="control"><span>Crie sua senha</span><input id="password" type="password" autocomplete="new-password" minlength="6" placeholder="mínimo 6 caracteres" required></label>
        <label class="control"><span>Código de ativação</span><input id="code" autocomplete="one-time-code" required placeholder="código fornecido pela DEZE7"></label>
        <button id="activate" class="btn btn-primary btn-lg full" type="submit">Ativar conta</button>
      </form>

      <div id="msg" class="msg"></div>

      <div id="success" class="hidden">
        <p><strong>Conta ativada.</strong> Agora entre normalmente no painel.</p>
        <a class="btn btn-secondary btn-lg full" href="admin.html">Abrir painel DEZE7</a>
      </div>

      <p class="small">Se você já ativou sua conta, use diretamente o <a class="link" href="admin.html">Painel DEZE7</a>.</p>
    </section>
  </main>

  <script>
    const ENDPOINT = 'https://vmitpfyqnlsrrrbvgjeo.supabase.co/functions/v1/deze7-activate';
    const $ = id => document.getElementById(id);

    function show(text,type='warn'){
      const el=$('msg');
      el.textContent=text;
      el.className='msg '+type;
    }

    $('form').addEventListener('submit', async (e)=>{
      e.preventDefault();

      const email=$('email').value.trim().toLowerCase();
      const password=$('password').value;
      const code=$('code').value.trim();

      if(!email || !password || !code){
        show('Preencha todos os campos.','err');
        return;
      }
      if(password.length<6){
        show('A senha precisa ter pelo menos 6 caracteres.','err');
        return;
      }

      const btn=$('activate');
      btn.disabled=true;
      btn.textContent='Ativando...';
      show('Validando autorização e criando a conta...','warn');

      try{
        const res = await fetch(ENDPOINT,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({email,password,code}),
          cache:'no-store'
        });

        const data = await res.json().catch(()=>({}));
        if(!res.ok || !data.ok){
          throw new Error(data.error || ('Falha na ativação (HTTP '+res.status+').'));
        }

        show(data.message || 'Conta ativada com sucesso.','ok');
        $('form').classList.add('hidden');
        $('success').classList.remove('hidden');
      }catch(err){
        const msg = String(err && err.message ? err.message : err);
        if(msg.toLowerCase().includes('failed to fetch')){
          show('O navegador bloqueou a comunicação com o servidor. Atualize esta página e tente novamente pelo Chrome.','err');
        }else{
          show(msg,'err');
        }
      }finally{
        btn.disabled=false;
        btn.textContent='Ativar conta';
      }
    });
  </script>
</body>
</html>
